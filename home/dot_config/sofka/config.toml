[skin]
name = "tokyo-night"
background = false   # fill views with the skin's own background swatch
# (default: false = inherit the terminal background)

# [skin.colors]            # optional per-swatch overrides
# red = "#fb4934"


[keys.navigation]
# Vim-style ctrl-n/p and ctrl-d/u everywhere that scrolls; ctrl-f/b already
# page in most views (logs added below).
down = ["j", "down", "ctrl-n"]
up = ["k", "up", "ctrl-p"]
half_page_down = "ctrl-d"
half_page_up = "ctrl-u"

[keys.logs]
page_down = ["pagedown", "space", "ctrl-f"]
page_up = ["pageup", "ctrl-b"]

# Text-input pickers ignore [keys.navigation] up/down.
[keys.namespaces]
down = ["down", "ctrl-n"]
up = ["up", "ctrl-p"]

[keys.context_filter]
down = ["down", "ctrl-n"]
up = ["up", "ctrl-p"]

[keys.command]
down = ["ctrl-n", "tab", "down"]
up = ["ctrl-p", "backtab", "up"]
complete = ["ctrl-y", "right"]

[keys.table]
delete = "alt-d" # ctrl-d is half-page now; ctrl-k (force-delete) unchanged
history_back = ["alt-left", "["]
history_forward = ["alt-right", "]"]

[[guardrails]]
contexts = ["*prod*"]
actions = ["delete", "force-delete", "drain", "restart", "rollback"]
confirmation = "type-context-name"
max_bulk = 3
